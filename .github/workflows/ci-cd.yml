name: CI/CD OptiService
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: test -s dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar aplicação
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar resposta HTTP
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --location --retry 5 --retry-delay 5 "$SITE_URL" -o /tmp/optiservice.html && grep -q 'OptiService' /tmp/optiservice.html
